# Model Gateway Configuration

# ── Provider definitions ──────────────────────────────────────────────────────
x-providers:
  inference_service: &poolside
    openai_compatible:
      model: poolside/laguna-s-2.1
      base_url: https://inference.poolside.ai   
      api_key: env.POOLSIDE_API_KEY             
    model_info:
      exposed: true
      provider: poolside
      family: laguna
      version: "s-2.1"
      max_input_tokens: 262144
      max_output_tokens: 32768
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000002
      supports_prompt_caching: false
      supports_vision: false
      mode: chat

  # inference_service: &nvidia-nim
  #   openai_compatible:
  #     model: nvidia/nemotron-3-ultra-550b-a55b
  #     base_url: "https://integrate.api.nvidia.com"
  #     api_key: env.NVAPI_API_KEY          
  #   model_info:
  #     exposed: true
  #     provider: nvidia
  #     family: nemotron
  #     version: "3-ultra"
  #     max_input_tokens: 262144
  #     max_output_tokens: 32768
  #     input_cost_per_token: 0.0000006
  #     output_cost_per_token: 0.0000025
  #     supports_prompt_caching: false
  #     supports_vision: false
  #     mode: chat


# ── Models ────────────────────────────────────────────────────────────────────
models:
  # ── ACTIVE MODEL ─────────────────────────────────────────────────────────────
  - &chat_llm
    <<: *poolside
    model_name: premium-ide
    model_info:
      exposed: true

  # ── Aliases ───────────────────────────────────────────────────────────────────
  - <<: *chat_llm
    model_name: security

  - <<: *chat_llm
    model_name: background


# ── Router ────────────────────────────────────────────────────────────────────
routers:
  - name: router
    strategy: static
    static:
      default_model: premium-ide
